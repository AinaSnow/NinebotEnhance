name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-build
      - name: Create temporary CI signing key
        run: python3 scripts/create_signing_key.py --jdk "$JAVA_HOME" --output-dir "$RUNNER_TEMP/ninebot-ci-signing"
      - name: Compile, test and verify APK
        run: >-
          python3 scripts/build.py --sdk "$ANDROID_HOME" --jdk "$JAVA_HOME"
          --keystore "$RUNNER_TEMP/ninebot-ci-signing/release.jks"
          --password-file "$RUNNER_TEMP/ninebot-ci-signing/password.txt"
          --allow-other-signer
      - name: Verify Gradle build
        run: bash gradlew :app:assembleDebug --no-daemon
      - name: Package CI artifacts
        run: python3 scripts/package_artifacts.py --kind ci
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: NinebotEnhance-ci-${{ github.run_number }}-${{ github.run_attempt }}
          path: dist/ci/
          if-no-files-found: error
          retention-days: 7
      - name: Remove temporary signing files
        if: always()
        run: rm -f "$RUNNER_TEMP/ninebot-ci-signing/release.jks" "$RUNNER_TEMP/ninebot-ci-signing/password.txt" "$RUNNER_TEMP/ninebot-ci-signing/certificate.der"
